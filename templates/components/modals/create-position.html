{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Create Position
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalCreatePos" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Dept. Position</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="createErrors" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label required">Title</label>
            <input type="text" id="createTitle" class="form-control" placeholder="Software Engineer">
          </div>
          <div class="mb-3">
            <label class="form-label">Department</label>
            <select id="createDeptId" class="form-select">
              <option value="">— None —</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnCreatePos">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>
