{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Unassign Employee Group
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="unassignGroupModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Unassign from Group</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="unassign-emp-id">
          <input type="hidden" id="unassign-group-id">
          <p class="mb-0">Remove <strong id="unassign-emp-name">—</strong> from <strong id="unassign-group-name">—</strong>?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-unassign-empGroup">
            Unassign
          </button>
        </div>
      </div>
    </div>
  </div>
