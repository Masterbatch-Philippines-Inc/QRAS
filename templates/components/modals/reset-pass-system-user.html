{% load static %}
  <!-- ══════════════════════════════════════════════════════════════
      MODAL — Reset Password of System User
  ═══════════════════════════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="resetPasswordModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-body">
          <div class="modal-title">Reset Password</div>
          <div>Are you sure you want to reset <strong id="resetUserName"></strong>'s password? A new password will be generated and sent to their email.</div>
          <div id="resetPasswordError" class="alert alert-danger mt-3 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="resetPasswordBtn" onclick="submitResetPassword()">
            Proceed
          </button>
        </div>
      </div>
    </div>
  </div>
