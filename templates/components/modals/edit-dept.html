{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Edit Dept
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalEditDept" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Department</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="editErrors" class="alert alert-danger d-none"></div>
          <input type="hidden" id="editDeptId">
          <div class="mb-3">
            <label class="form-label required">Name</label>
            <input type="text" id="editName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label required">Code</label>
            <input type="text" id="editCode" class="form-control" style="text-transform:uppercase">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnEditDept">Update</button>
        </div>
      </div>
    </div>
  </div>
