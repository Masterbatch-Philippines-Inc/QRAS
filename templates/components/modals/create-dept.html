{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Create Dept
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalCreateDept" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Department</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="createErrors" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label required">Name</label>
            <input type="text" id="createName" class="form-control" placeholder="Human Resources">
          </div>
          <div class="mb-3">
            <label class="form-label required">Code</label>
            <input type="text" id="createCode" class="form-control" placeholder="HR" style="text-transform:uppercase">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnCreateDept">
            <i class="ti ti-device-floppy me-1"></i>Save
          </button>
        </div>
      </div>
    </div>
  </div>
