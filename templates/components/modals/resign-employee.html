{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Resign Employee
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalResignEmployee" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resignModalTitle">Mark as Resigned</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="resignEmpId">
          <input type="hidden" id="resignEmpIsResigned">
          <p class="text-secondary mb-0" id="resignModalMessage">
            Are you sure you want to mark this employee as resigned?
            This will set their status to inactive.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnResignEmployee">
            <i class="ti ti-user-off me-1"></i>
            <span id="resignBtnLabel">Mark as Resigned</span>
          </button>
        </div>
      </div>
    </div>
  </div>
