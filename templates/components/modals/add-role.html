{% load static %}
  <!-- ══════════════════════════════════════════════════════════════
      MODAL — Add System User Role
  ═══════════════════════════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="addRoleModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Role</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="addRoleError" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label required">Role Name</label>
            <input id="addRoleName" type="text" class="form-control" placeholder="e.g. HR Officer" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="addRoleBtn" onclick="submitCreateRole()">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>
