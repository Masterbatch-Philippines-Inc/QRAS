{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Edit Employee
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalEditEmployee" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">
            <i class="ti ti-user-edit me-2"></i>Edit Employee Details
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-0">
          <div id="editEmpErrors" class="alert alert-danger rounded-0 mb-0 d-none"></div>
          <input type="hidden" id="editEmpId">

          <!-- Tabs -->
          <ul class="nav nav-tabs nav-fill px-3 pt-3">
            <li class="nav-item">
              <a class="nav-link active" data-bs-toggle="tab" href="#tabEmpBasic">
                <i class="ti ti-id-badge me-1"></i>Basic Info
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#tabEmpContact">
                <i class="ti ti-phone me-1"></i>Contact
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#tabEmpGovIds">
                <i class="ti ti-file-certificate me-1"></i>Gov. IDs
              </a>
            </li>
          </ul>

          <div class="tab-content p-3">

            <!-- Tab 1: Basic Info -->
            <div class="tab-pane fade show active" id="tabEmpBasic">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label required">First Name</label>
                  <input type="text" id="editEmpFirstName" class="form-control" placeholder="Juan">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Middle Name</label>
                  <input type="text" id="editEmpMiddleName" class="form-control" placeholder="Santos">
                </div>
                <div class="col-md-4">
                  <label class="form-label required">Last Name</label>
                  <input type="text" id="editEmpLastName" class="form-control" placeholder="Dela Cruz">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Suffix</label>
                  <input type="text" id="editEmpSuffix" class="form-control" placeholder="Jr., Sr., III">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Birthday</label>
                  <input type="date" id="editEmpBirthDate" class="form-control">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Hire Date</label>
                  <input type="date" id="editEmpHireDate" class="form-control">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Date Regularized</label>
                  <input type="date" id="editEmpDateRegularized" class="form-control">
                </div>
                <div class="col-md-6">
                  <label class="form-label required">Department</label>
                  <select id="editEmpDepartmentId" class="form-select">
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                  </select>
                  <script>new TomSelect('#editEmpDepartmentId', { create: false, maxItems: 1 });</script>
                </div>
                <div class="col-md-6">
                  <label class="form-label required">Position</label>
                  <select id="editEmpPositionId" class="form-select" disabled>
                    <option value="">— Select department first —</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Tab 2: Contact -->
            <div class="tab-pane fade" id="tabEmpContact">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Contact No.</label>
                  <input type="text" id="editEmpContactNo" class="form-control" data-mask="(+63)900-000-0000" data-mask-visible="true" placeholder="(+63)900-000-0000" autocomplete="off">
                </div>
                <div class="col-md-12">
                  <label class="form-label">Address 1</label>
                  <input type="text" id="editEmpAddress1" class="form-control" placeholder="House No., Street">
                </div>
                <div class="col-md-12">
                  <label class="form-label">Address 2</label>
                  <input type="text" id="editEmpAddress2" class="form-control" placeholder="Barangay, City, Province">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Emergency Contact Person</label>
                  <input type="text" id="editEmpSosName" class="form-control" placeholder="Maria Dela Cruz">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Emergency Contact No.</label>
                  <input type="text" id="editEmpSosNo" class="form-control" data-mask="(+63)900-000-0000" data-mask-visible="true" placeholder="(+63)900-000-0000" autocomplete="off">
                </div>
              </div>
            </div>

            <!-- Tab 3: Gov IDs -->
            <div class="tab-pane fade" id="tabEmpGovIds">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">TIN No.</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="ti ti-receipt-tax"></i></span>
                    <input type="text" id="editEmpTin" name="tin_no" class="form-control" data-mask="000-000-000" data-mask-visible="true" placeholder="00000-000" autocomplete="off">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">SSS No.</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="ti ti-shield-check"></i></span>
                    <input type="text" id="editEmpSss" name="sss_no" class="form-control" data-mask="00-0000000-0" data-mask-visible="true" placeholder="00-0000000-0" autocomplete="off">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">PhilHealth No.</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="ti ti-heart-rate-monitor"></i></span>
                    <input type="text" id="editEmpPhilhealth" name="philhealth_no" class="form-control" data-mask="00-000000000-0" data-mask-visible="true" placeholder="00-000000000-0" autocomplete="off">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Pag-IBIG No.</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="ti ti-home"></i></span>
                    <input type="text" id="editEmpPagibig" name="pagibig_no" class="form-control" data-mask="0000-0000-0000" data-mask-visible="true" placeholder="0000-0000-0000" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnEditEmployee">
            <i class="ti ti-device-floppy me-1"></i>Save Changes
          </button>
        </div>

      </div>
    </div>
  </div>
