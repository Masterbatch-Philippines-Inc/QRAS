{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Edit Employee Group
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalEditGroup" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Group</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="editGroupErrors" class="alert alert-danger d-none"></div>
          <input type="hidden" id="editGroupId">
          <div class="mb-3">
            <label class="form-label required">Group Name</label>
            <input type="text" id="editGroupName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="editGroupOt">
              <span class="form-check-label">OT Filing Exempted</span>
            </label>
            <div class="text-secondary small mt-1">
              Exempted groups have OT auto-approved when detected.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnEditGroup">
            <i class="ti ti-device-floppy me-1"></i>Update
          </button>
        </div>
      </div>
    </div>
  </div>
