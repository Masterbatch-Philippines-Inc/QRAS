{% load static %}
  <div class="modal modal-blur fade" id="HDrejectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reject Halfday Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Remarks <span class="text-secondary">(optional)</span></label>
          <textarea id="reject-remarks" class="form-control" rows="3" placeholder="Reason for rejection…"></textarea>
          <input type="hidden" id="reject-hd-id" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-halfday-reject" data-bs-dismiss="modal">Confirm Reject</button>
        </div>
      </div>
    </div>
  </div>
