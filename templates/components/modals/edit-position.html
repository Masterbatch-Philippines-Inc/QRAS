{% load static %}
  <!-- ═══════════════════════════════════════════
      MODAL — Edit Position
  ═══════════════════════════════════════════ -->
  <div class="modal modal-blur fade" id="modalEditPos" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Position</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="editErrors" class="alert alert-danger d-none"></div>
          <input type="hidden" id="editPosId">
          <div class="mb-3">
            <label class="form-label required">Title</label>
            <input type="text" id="editTitle" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Department</label>
            <select id="editPostDeptId" class="form-select">
              <option value="">— None —</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost-secondary me-auto" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnEditPos">
            <i class="ti ti-device-floppy me-1"></i>Update
          </button>
        </div>
      </div>
    </div>
  </div>
